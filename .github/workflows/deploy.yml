name: Deploy Spring Boot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ruon-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Configure SSH
        env:
          SSH_KEY: ${{ ecrets.SERVER_SSH_KEY_BASE64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
            build/libs/RUON-0.0.1-SNAPSHOT.jar \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/app.jar.new"

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" '
              set -e

              sudo cp /opt/ruon/app.jar /opt/ruon/app.jar.prev
              sudo install -m 644 /home/ubuntu/app.jar.new /opt/ruon/app.jar
              rm -f /home/ubuntu/app.jar.new
              sudo systemctl restart ruon

              for i in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:8080/swagger-ui/index.html >/dev/null; then
                  echo "Deployment successful"
                  exit 0
                fi
                sleep 5
              done

              echo "Deployment failed. Rolling back."
              sudo install -m 644 /opt/ruon/app.jar.prev /opt/ruon/app.jar
              sudo systemctl restart ruon
              sudo journalctl -u ruon -n 100 --no-pager
              exit 1
            '