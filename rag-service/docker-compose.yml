name: cosmetic-rag

services:
  mariadb:
    image: mariadb:11.7   # VECTOR 타입 & MHNSW 인덱스 지원 (11.7+)
    container_name: cosmetic-rag-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: cosmetic_rag
      MARIADB_USER: rag_user
      MARIADB_PASSWORD: rag_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  mariadb_data:
